[workspace]
members = [
    "crates/nexus-core",
    "crates/nexus-math",
    "crates/nexus-vcp",
    "crates/nexus",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
nexus-core = { path = "crates/nexus-core" }
nexus-math = { path = "crates/nexus-math" }
nexus-vcp = { path = "crates/nexus-vcp" }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
wide = "1.7.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
schemars = "1.2.3"
criterion = "0.8.2"
dhat = "0.3.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
